<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Chat</title>
    <link href="./src/styles/common.css" rel="stylesheet" />
    <!-- PrismJS theme for syntax highlighting -->
    <link rel="stylesheet" href="./node_modules/prismjs/themes/prism-tomorrow.min.css" />
    <style>
      /* Font Awesome now loaded via <link> above */

      body {
        background: transparent !important;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      .chat-container {
        width: 100%;
        height: 100vh;
        background: linear-gradient(
          135deg,
          rgba(0, 0, 0, 0.3) 0%,
          rgba(20, 20, 20, 0.4) 100%
        );
        backdrop-filter: blur(25px);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        -webkit-app-region: drag;
      }
      .chat-header {
        padding: 16px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
        -webkit-app-region: drag;
        background: rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(10px);
        cursor: move;
        flex-shrink: 0;
      }
      .header-title {
        color: rgba(255, 255, 255, 0.95);
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      /* Header actions (e.g., Clear History) */
      .header-actions {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .icon-button {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: rgba(255, 255, 255, 0.9);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .icon-button:hover {
        background: rgba(255, 255, 255, 0.22);
        color: #fff;
      }
      .icon-button.active {
        background: rgba(76, 175, 80, 0.35);
        border-color: rgba(76, 175, 80, 0.6);
        color: #a5d6a7;
      }
      .recording-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff4757;
        animation: pulse 2s infinite;
        display: none;
        box-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
      }
      @keyframes pulse {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.1);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-app-region: no-drag;
        box-sizing: border-box;
        /* Removed max-height restriction */
      }
      .message {
        margin-bottom: 16px;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        border-left: 3px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(5px);
        word-wrap: break-word;
        word-break: break-word;
        /* Removed all height restrictions */
        position: relative;
      }
      .message.transcription {
        background: rgba(76, 175, 80, 0.15);
        animation: fadeInSlide 0.1s ease-out;
        position: relative;
      }
      .message.transcription-bilingual {
        background: rgba(76, 175, 80, 0.12);
        border-left: 3px solid #4caf50;
      }
      .bilingual-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 6px;
      }
      @media (max-width: 540px) {
        .bilingual-grid {
          grid-template-columns: 1fr;
        }
      }
      .bilingual-column {
        background: rgba(0, 0, 0, 0.25);
        border-radius: 6px;
        padding: 8px 10px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .bilingual-col-header {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 5px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .bilingual-col-header.en {
        color: #64b5f6;
      }
      .bilingual-col-header.pt {
        color: #81c784;
      }
      .bilingual-text {
        font-size: 13px;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.95);
        word-break: break-word;
        white-space: pre-wrap;
      }

      .message.transcription::before {
        position: absolute;
        left: -8px;
        top: 8px;
        font-size: 12px;
        color: white;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @keyframes fadeInSlide {
        from {
          opacity: 0;
          transform: translateX(-20px);
          background: rgba(76, 175, 80, 0.3);
        }
        to {
          opacity: 1;
          transform: translateX(0);
          background: rgba(76, 175, 80, 0.15);
        }
      }
      .message.system {
        background: rgba(33, 150, 243, 0.1);
      }
      .message.error {
        background: rgba(244, 67, 54, 0.1);
      }
      .message.user {
        background: rgba(255, 152, 0, 0.1);
      }
      .message.assistant {
        background: rgba(156, 39, 176, 0.1);
        border-left: 3px solid #9c27b0;
        /* Removed all height restrictions and overflow hidden */
        display: block;
      }

      /* Meeting Summary & Ended Banner */
      .message.meeting-summary {
        background: linear-gradient(135deg, rgba(124, 77, 255, 0.16) 0%, rgba(33, 150, 243, 0.1) 100%);
        border: 1px solid rgba(124, 77, 255, 0.35);
        border-left: 4px solid #7c4dff;
        border-radius: 8px;
        padding: 12px 14px;
        margin: 12px 0;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }
      .meeting-summary-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .meeting-summary-title {
        font-size: 13px;
        font-weight: 700;
        color: #b388ff;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .meeting-summary-meta {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.6);
      }
      .meeting-summary-body {
        font-size: 13px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.95);
      }
      .meeting-summary-body h1, .meeting-summary-body h2 {
        font-size: 14px;
        color: #b388ff;
        margin-top: 10px;
        margin-bottom: 6px;
      }
      .meeting-summary-body h3 {
        font-size: 13px;
        color: #80d8ff;
        margin-top: 8px;
        margin-bottom: 4px;
      }
      .meeting-summary-body ul, .meeting-summary-body ol {
        margin: 6px 0;
        padding-left: 20px;
      }
      .meeting-summary-body li {
        margin-bottom: 4px;
      }
      .meeting-summary-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .summary-action-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: rgba(255, 255, 255, 0.9);
        border-radius: 5px;
        padding: 5px 10px;
        font-size: 11px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        transition: all 0.2s ease;
      }
      .summary-action-btn:hover {
        background: rgba(124, 77, 255, 0.35);
        border-color: #7c4dff;
        color: #fff;
      }
      .meeting-ended-banner {
        background: rgba(33, 150, 243, 0.15);
        border: 1px solid rgba(33, 150, 243, 0.3);
        border-radius: 8px;
        padding: 10px 12px;
        margin: 10px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        animation: fadeInSlide 0.2s ease-out;
      }
      .meeting-ended-banner .banner-content {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.9);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .meeting-ended-banner .banner-buttons {
        display: flex;
        gap: 6px;
      }
      .banner-action-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 11px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        transition: all 0.2s ease;
      }
      .banner-action-btn.primary {
        background: #7c4dff;
        border-color: #7c4dff;
        font-weight: 600;
      }
      .banner-action-btn:hover {
        filter: brightness(1.15);
      }
      #summarizeMeetingBtn.loading {
        opacity: 0.6;
        pointer-events: none;
      }

      /* Speaker Badges */
      .speaker-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 2px 7px;
        border-radius: 4px;
        margin-bottom: 5px;
      }
      .speaker-badge.interviewer {
        background: rgba(0, 229, 255, 0.15);
        color: #00e5ff;
        border: 1px solid rgba(0, 229, 255, 0.35);
      }
      .speaker-badge.user {
        background: rgba(0, 230, 118, 0.15);
        color: #00e676;
        border: 1px solid rgba(0, 230, 118, 0.35);
      }
      .speaker-badge.speaker {
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      /* History Modal */
      .history-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(8px);
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .history-modal-overlay.active {
        display: flex;
      }
      .history-modal-container {
        background: #181824;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        width: 95vw;
        max-width: 900px;
        height: 85vh;
        max-height: 680px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        overflow: hidden;
      }
      .history-modal-header {
        padding: 14px 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255, 255, 255, 0.02);
      }
      .modal-title-group .modal-title {
        font-size: 15px;
        font-weight: 700;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .modal-title-group .modal-subtitle {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.5);
        margin-top: 2px;
      }
      .modal-header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .modal-action-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
        border-radius: 5px;
        padding: 5px 10px;
        font-size: 11px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .modal-action-btn:hover {
        background: rgba(255, 255, 255, 0.15);
      }
      .modal-close-btn {
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.6);
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
        padding: 0 4px;
      }
      .modal-close-btn:hover {
        color: #fff;
      }
      .history-toolbar {
        padding: 10px 18px;
        display: flex;
        gap: 12px;
        align-items: center;
        background: rgba(0, 0, 0, 0.2);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .history-search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        padding: 6px 12px;
      }
      .history-search-box input {
        background: transparent;
        border: none;
        outline: none;
        color: #fff;
        font-size: 12px;
        width: 100%;
      }
      .history-stats-pill {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.6);
        white-space: nowrap;
      }
      .history-modal-body {
        flex: 1;
        display: grid;
        grid-template-columns: 320px 1fr;
        overflow: hidden;
      }
      @media (max-width: 700px) {
        .history-modal-body {
          grid-template-columns: 1fr;
        }
      }
      .history-cards-column {
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .history-meeting-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        padding: 10px 12px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .history-meeting-card:hover {
        background: rgba(255, 255, 255, 0.07);
        border-color: rgba(124, 77, 255, 0.4);
      }
      .history-meeting-card.selected {
        background: rgba(124, 77, 255, 0.14);
        border-color: #7c4dff;
      }
      .card-top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 5px;
      }
      .card-date {
        font-size: 12px;
        font-weight: 700;
        color: #fff;
      }
      .card-summary-badge {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: 600;
      }
      .card-summary-badge.has-summary {
        background: rgba(124, 77, 255, 0.25);
        color: #b388ff;
        border: 1px solid rgba(124, 77, 255, 0.4);
      }
      .card-summary-badge.no-summary {
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.4);
      }
      .card-meta-row {
        display: flex;
        gap: 6px;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.5);
        margin-bottom: 6px;
        flex-wrap: wrap;
      }
      .card-preview-text {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.7);
        line-height: 1.35;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .history-preview-column {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: rgba(0, 0, 0, 0.15);
      }
      .preview-empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: rgba(255, 255, 255, 0.4);
        font-size: 12px;
        padding: 20px;
        text-align: center;
      }
      .preview-active-content {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }
      .preview-header {
        padding: 12px 18px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .preview-title {
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 4px;
      }
      .preview-meta-row {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.5);
        margin-bottom: 8px;
        display: flex;
        gap: 12px;
      }
      .preview-tabs {
        display: flex;
        gap: 8px;
      }
      .preview-tab-btn {
        background: transparent;
        border: none;
        border-bottom: 2px solid transparent;
        color: rgba(255, 255, 255, 0.6);
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .preview-tab-btn.active {
        color: #b388ff;
        border-bottom-color: #7c4dff;
      }
      .preview-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px 18px;
        font-size: 13px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.9);
      }
      .preview-actions {
        padding: 10px 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        gap: 8px;
        background: rgba(255, 255, 255, 0.02);
      }
      .preview-action-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
        border-radius: 5px;
        padding: 5px 10px;
        font-size: 11px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .preview-action-btn.primary {
        background: #7c4dff;
        border-color: #7c4dff;
      }
      .preview-action-btn.danger {
        color: #ff5252;
        border-color: rgba(255, 82, 82, 0.3);
      }
      .preview-action-btn.danger:hover {
        background: rgba(255, 82, 82, 0.15);
      }
      
      .message.assistant .message-text {
        /* Removed all height restrictions and overflow hidden */
        white-space: pre-wrap;
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
      }
      
      /* Ensure all content in assistant messages is fully visible */
      .message.assistant *,
      .message.assistant .bullet-point,
      .message.assistant .numbered-point,
      .message.assistant strong,
      .message.assistant em,
      .message.assistant code,
      .message.assistant pre,
      .message.assistant ul,
      .message.assistant ol,
      .message.assistant li,
      .message.assistant h1,
      .message.assistant h2,
      .message.assistant h3,
      .message.assistant h4,
      .message.assistant h5,
      .message.assistant h6,
      .message.assistant p,
      .message.assistant blockquote {
        /* Remove all height restrictions */
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
      }
      
      /* Markdown formatting for assistant messages */
      .message.assistant .bullet-point {
        margin: 4px 0;
        padding-left: 8px;
        line-height: 1.4;
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
      }
      
      .message.assistant .numbered-point {
        margin: 4px 0;
        padding-left: 16px;
        line-height: 1.4;
        position: relative;
        counter-increment: list-counter;
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
      }
      
      .message.assistant .numbered-point::before {
        content: counter(list-counter) ". ";
        position: absolute;
        left: 0;
        font-weight: 500;
        color: rgba(156, 39, 176, 0.8);
      }
      
      .message.assistant {
        counter-reset: list-counter;
      }
      
      .message.assistant strong {
        font-weight: 600;
        color: rgba(255, 255, 255, 1);
      }
      
      .message.assistant em {
        font-style: italic;
        color: rgba(255, 255, 255, 0.9);
      }
      
      .message.assistant code {
        background: rgba(0, 0, 0, 0.3);
        padding: 2px 4px;
        border-radius: 3px;
        font-family: 'Monaco', 'Menlo', monospace;
        font-size: 11px;
        color: #64ffda;
        display: inline;
      }
      
      /* Ensure code blocks are fully visible */
      .message.assistant pre {
        background: rgba(0, 0, 0, 0.4);
        padding: 8px 12px;
        border-radius: 6px;
        font-family: 'Monaco', 'Menlo', monospace;
        font-size: 11px;
        color: #64ffda;
        overflow-x: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
        margin: 8px 0;
        position: relative;
      }
      
      .message.assistant pre code {
        background: transparent;
        padding: 0;
        border-radius: 0;
        display: block;
      }

      /* Copy button in code blocks */
      .copy-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        background: rgba(0, 0, 0, 0.5);
        color: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 4px 8px;
        font-size: 11px;
        border-radius: 4px;
        cursor: pointer;
        -webkit-app-region: no-drag;
        transition: background 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
      }
      .copy-btn:hover {
        background: rgba(0,0,0,0.7);
      }
      .copy-btn.copied {
        background: rgba(76, 175, 80, 0.8);
        border-color: rgba(76, 175, 80, 0.9);
        transform: scale(0.98);
      }
      
      /* Ensure lists are fully visible */
      .message.assistant ul,
      .message.assistant ol {
        margin: 8px 0;
        padding-left: 20px;
      }
      
      .message.assistant li {
        margin: 4px 0;
        line-height: 1.4;
      }
      
      /* Ensure headings are fully visible */
      .message.assistant h1,
      .message.assistant h2,
      .message.assistant h3,
      .message.assistant h4,
      .message.assistant h5,
      .message.assistant h6 {
        margin: 12px 0 8px 0;
        font-weight: 600;
        color: rgba(255, 255, 255, 1);
      }
      
      .message.assistant h1 { font-size: 16px; }
      .message.assistant h2 { font-size: 15px; }
      .message.assistant h3 { font-size: 14px; }
      .message.assistant h4,
      .message.assistant h5,

    <script>
      // Configure Prism autoloader
      try { if (window.Prism && Prism.plugins && Prism.plugins.autoloader) { Prism.plugins.autoloader.languages_path = './node_modules/prismjs/components/'; } } catch (_) {}

    <script>
      // Use electronAPI from preload script instead of direct require
      const whysperAPI = window.electronAPI;

      const chatMessages = document.getElementById('chatMessages');
      const recordingIndicator = document.getElementById('recordingIndicator');
      const messageInput = document.getElementById('messageInput');
      const sendButton = document.getElementById('sendButton');
      const micButton = document.getElementById('micButton');
      const chatContainer = document.getElementById('chatContainer');
      const listeningIndicator = document.getElementById('listeningIndicator');
      const listeningDuration = document.getElementById('listeningDuration');
      const interimOverlay = document.getElementById('interimOverlay');
      const clearHistoryBtn = document.getElementById('clearHistoryBtn');
      const translateToggleBtn = document.getElementById('translateToggleBtn');
      const translateToggleLabel = document.getElementById('translateToggleLabel');
      const summarizeMeetingBtn = document.getElementById('summarizeMeetingBtn');
      const summarizeBtnLabel = document.getElementById('summarizeBtnLabel');

      let isRecording = false;
      let isInteractive = true;
      let isTranslationEnabled = false;
      let isSummarizingMeeting = false;
      let listeningStartTime = null;
      let listeningTimer = null;
      let speechAvailable = false;
      let currentSkill = 'interview';

      // Chat persistence and deduplication
      const CHAT_HISTORY_KEY = 'opencluely_chat_history_v1';
      let chatHistory = [];
      const recentResponseHashes = new Set();
      const RECENT_HASH_LIMIT = 50;

      function hashString(str) {
        try {
          let h = 2166136261 >>> 0; // FNV-1a
          for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619);
          }
          return (h >>> 0).toString(16);
        } catch (_) {
          return String(str?.length || 0);
        }
      }

      function saveHistory() {
        try {
          localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(chatHistory.slice(-500)));
        } catch (e) {
          console.warn('Failed to save history', e);
        }
      }

      function loadHistory() {
        try {
          const raw = localStorage.getItem(CHAT_HISTORY_KEY);
          if (!raw) return;
          const items = JSON.parse(raw);
          if (Array.isArray(items)) {
            chatHistory = items;
            // Render
            items.forEach(item => {
              if (item.kind === 'message') {
                addMessage(item.text, item.type, true, item.speaker);
              } else if (item.kind === 'snippet') {
                addCodeSnippet(item.language, item.code, true);
              } else if (item.kind === 'bilingual_transcription') {
                addBilingualTranscription(item.originalText, item.translationPT, true, item.speaker);
              } else if (item.kind === 'meeting_summary') {
                addMeetingSummaryMessage(item.summaryText, item.metadata || {}, true);
              }
            });
          }
        } catch (e) {
          console.warn('Failed to load history', e);
        }
      }

      function clearChatHistory(skipConfirm = false) {
        if (!skipConfirm) {
          const ok = confirm('Clear chat history?');
          if (!ok) return;
        }
        chatHistory = [];
        saveHistory();
        // Clear DOM
        if (chatMessages) chatMessages.innerHTML = '';
      }

      function applyMicVisibility() {
        if (micButton) {
          micButton.style.display = speechAvailable ? '' : 'none';
        }
      }
      
      async function initSpeechAvailability() {
        try {
          if (window.electronAPI && window.electronAPI.getSpeechAvailability) {
            speechAvailable = await window.electronAPI.getSpeechAvailability();
            applyMicVisibility();
          }
        } catch (e) {
          speechAvailable = false;
          applyMicVisibility();
        }
      }
      
      // Listen for availability changes
      if (whysperAPI && whysperAPI.onSpeechAvailability) {
        whysperAPI.onSpeechAvailability((event, data) => {
          speechAvailable = !!(data && data.available);
          applyMicVisibility();
        });
      }
      
      // Also capture generic LLM responses (from OCR/screenshot flows)
      if (whysperAPI && whysperAPI.onLlmResponse) {
        whysperAPI.onLlmResponse((event, data) => {
          try { hideThinkingIndicator(); } catch (_) {}
          if (data && data.response) {
            renderAssistantResponse(data.response);
          }
        });
      }

      // Clear on session-cleared from main
      if (whysperAPI && whysperAPI.onSessionCleared) {
        whysperAPI.onSessionCleared(() => {
          clearChatHistory(true);
        });
      }

      // Initialize availability and history
      loadHistory();
      initSpeechAvailability();

      // Basic message function with markdown support for assistant messages
      function addMessage(text, type = 'user', skipPersist = false, speaker = null) {
        if (!chatMessages) {
          console.error('Chat messages element not found!');
          return;
        }

        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${type}`;

        const headerDiv = document.createElement('div');
        headerDiv.style.display = 'flex';
        headerDiv.style.justifyContent = 'space-between';
        headerDiv.style.alignItems = 'center';
        headerDiv.style.marginBottom = '4px';

        const speakerLabel = speaker || (type === 'transcription' ? 'Áudio' : null);
        if (speakerLabel && (type === 'transcription' || speaker)) {
          const upper = speakerLabel.toUpperCase();
          const isInterviewer = upper.includes('ENTREVISTADOR') || upper.includes('OUTROS') || upper.includes('SYSTEM');
          const isUser = upper.includes('VOCÊ') || upper.includes('VOCE') || upper.includes('CANDIDATO');
          const badgeClass = isInterviewer ? 'interviewer' : (isUser ? 'user' : 'speaker');
          const badgeIcon = isInterviewer ? 'fa-user-tie' : (isUser ? 'fa-microphone' : 'fa-user');

          const badgeSpan = document.createElement('span');
          badgeSpan.className = `speaker-badge ${badgeClass}`;
          badgeSpan.innerHTML = `<i class="fas ${badgeIcon}"></i> ${escapeHtml(speakerLabel)}`;
          headerDiv.appendChild(badgeSpan);
        } else {
          headerDiv.appendChild(document.createElement('span'));
        }

        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();
        headerDiv.appendChild(timeDiv);

        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';
        
        // Format assistant messages as markdown
        if (type === 'assistant') {
          textDiv.innerHTML = formatMarkdown(text);
          if (window.renderMathInElement) window.renderMathInElement(textDiv);
        } else {
          textDiv.textContent = text;
        }

        messageDiv.appendChild(headerDiv);
        messageDiv.appendChild(textDiv);

        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        if (!skipPersist) {
          chatHistory.push({ kind: 'message', type, text, speaker });
          saveHistory();
        }
      }

      // Markdown formatter using markdown.js library
      function formatMarkdown(text) {
        if (!text) return '';
        
        try {
          if (typeof markdown !== 'undefined' && markdown.toHTML) {
            return markdown.toHTML(text);
          } else {
            console.warn('Markdown library not loaded, falling back to basic formatting');
            return text
              .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
              .replace(/\*(.+?)\*/g, '<em>$1</em>')
              .replace(/`(.+?)`/g, '<code>$1</code>')
              .replace(/\n/g, '<br>');
          }
        } catch (error) {
          console.error('Markdown parsing failed:', error);
          return text.replace(/\n/g, '<br>');
        }
      }

      // Render structured meeting summary card
      function addMeetingSummaryMessage(summaryText, metadata = {}, skipPersist = false) {
        if (!chatMessages) return;

        const messageDiv = document.createElement('div');
        messageDiv.className = 'message meeting-summary';

        const headerDiv = document.createElement('div');
        headerDiv.className = 'meeting-summary-header';

        const titleDiv = document.createElement('div');
        titleDiv.className = 'meeting-summary-title';
        titleDiv.innerHTML = '<i class="fas fa-file-invoice"></i> Resumo Executivo da Reunião';

        const metaDiv = document.createElement('div');
        metaDiv.className = 'meeting-summary-meta';
        const timeStr = metadata.time || new Date().toLocaleTimeString();
        const fileLabel = metadata.fileName ? ` • ${metadata.fileName}` : '';
        metaDiv.textContent = `${timeStr}${fileLabel}`;

        headerDiv.appendChild(titleDiv);
        headerDiv.appendChild(metaDiv);

        const textDiv = document.createElement('div');
        textDiv.className = 'message-text meeting-summary-body';
        textDiv.innerHTML = formatMarkdown(summaryText);
        if (window.renderMathInElement) window.renderMathInElement(textDiv);

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'meeting-summary-actions';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'summary-action-btn';
        copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copiar Resumo';
        copyBtn.addEventListener('click', async () => {
          if (whysperAPI && whysperAPI.copyToClipboard) {
            await whysperAPI.copyToClipboard(summaryText);
          } else {
            navigator.clipboard.writeText(summaryText);
          }
          copyBtn.innerHTML = '<i class="fas fa-check"></i> Copiado!';
          setTimeout(() => {
            copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copiar Resumo';
          }, 2000);
        });

        const folderBtn = document.createElement('button');
        folderBtn.className = 'summary-action-btn';

      // Request meeting summarization from LLM/backend
      async function triggerMeetingSummarization(filePath = null) {
        if (isSummarizingMeeting) return;
        isSummarizingMeeting = true;

        if (summarizeBtnLabel) summarizeBtnLabel.textContent = 'Gerando...';
        if (summarizeMeetingBtn) summarizeMeetingBtn.classList.add('loading');

        try {
          if (!whysperAPI || !whysperAPI.summarizeCallTranscript) {
            throw new Error('Serviço de resumo não disponível no processo principal.');
          }

          const result = await whysperAPI.summarizeCallTranscript(filePath ? { filePath } : null);

          if (result && result.success && result.summary) {
            addMeetingSummaryMessage(result.summary, {
              fileName: result.fileName,
              filePath: result.filePath,
              time: new Date().toLocaleTimeString()
            });
          } else {
            addMessage(`⚠️ ${result && result.error ? result.error : 'Não foi possível gerar o resumo da reunião.'}`, 'error');

          console.error('Falha ao resumir transcrição da reunião:', err);
          addMessage(`⚠️ Erro ao resumir reunião: ${err.message}`, 'error');
        } finally {
          isSummarizingMeeting = false;
          if (summarizeBtnLabel) summarizeBtnLabel.textContent = 'Resumo';

      function handleTranscription(text, transcriptionOnly = false, translationPT = null, speaker = null) {

            // Render transcribed text immediately without delay

          if (!transcriptionOnly && currentSkill !== 'transcript') {
            showThinkingIndicator();

      // Helpers to capture AI response into chat (text + snippets)
      function extractCodeBlocks(text) {
        if (!text) return [];
        const blocks = [];
        const regex = /(```|~~~)([^\n]*)\n([\s\S]*?)\1/g; // supports ```lang and ~~~lang
        let match;
        while ((match = regex.exec(text)) !== null) {
          const info = (match[2] || '').trim();
          const langToken = info.split(/\s+/)[0] || 'text';
          blocks.push({ language: langToken, code: match[3], fullMatch: match[0] });
        }
        return blocks;
      }
      function stripCodeBlocks(text, blocks) {
        let result = text || '';
        blocks.forEach(b => { result = result.replace(b.fullMatch, ''); });
        return result.replace(/\n\s*\n\s*\n/g, '\n\n').trim();
      }
      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str ?? '';
        return div.innerHTML;
      }
      function attachCopy(btn, codeText) {
        if (!btn) return;
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          try {
            let ok = false;
            if (window.electronAPI && typeof window.electronAPI.copyToClipboard === 'function') {
              ok = await window.electronAPI.copyToClipboard(codeText);
            }
            if (!ok) {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(codeText);
                ok = true;
              } else {
                const ta = document.createElement('textarea');
                ta.value = codeText;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                ok = true;
              }
            }
            if (ok) {
              btn.classList.add('copied');
              const original = btn.textContent;
              btn.textContent = 'Copied';
              setTimeout(() => { btn.classList.remove('copied'); btn.textContent = original || 'Copy'; }, 1200);
            }
          } catch (err) {
            console.warn('Copy failed', err);
          }
        });
      }
      function addCodeSnippet(language, code, skipPersist = false) {
        if (!chatMessages) return;
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message assistant';
        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();
        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';

        const lang = (language || 'text').toLowerCase();
        const pre = document.createElement('pre');
        const codeEl = document.createElement('code');
        codeEl.className = `language-${lang}`;
        codeEl.innerHTML = escapeHtml(code || '');

        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = 'Copy';
        attachCopy(copyBtn, code || '');

        pre.appendChild(copyBtn);
        pre.appendChild(codeEl);
        
        const label = document.createElement('div');
        label.style.cssText = 'font-size:12px;color:rgba(255,255,255,0.8);margin-bottom:6px;';
        label.textContent = `Snippet: ${lang.toUpperCase()}`;

        textDiv.appendChild(label);
        textDiv.appendChild(pre);

        messageDiv.appendChild(timeDiv);
        messageDiv.appendChild(textDiv);
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try { if (window.Prism && Prism.highlightElement) { Prism.highlightElement(codeEl); } } catch (_) {}

        if (!skipPersist) {
          chatHistory.push({ kind: 'snippet', language: lang, code: code || '' });
          saveHistory();
        }
      }
      function renderAssistantResponse(response) {
        if (!response || typeof response !== 'string') return;
        // Deduplication: avoid processing the same response twice
        const normalized = response.trim();
        const h = hashString(normalized);
        if (recentResponseHashes.has(h)) return;
        recentResponseHashes.add(h);
        if (recentResponseHashes.size > RECENT_HASH_LIMIT) {
          const first = recentResponseHashes.values().next().value;
          recentResponseHashes.delete(first);
        }

        const blocks = extractCodeBlocks(response);
        const textOnly = stripCodeBlocks(response, blocks);
        // Add text response first (if any)
        if (textOnly && textOnly.trim().length) {
          addMessage(textOnly, 'assistant');
        }
        // Add each code snippet separately
        blocks.forEach(b => addCodeSnippet(b.language, b.code));
      }

      let streamBuffers = {};

      function beginStreamingResponse(messageId) {
        try { hideThinkingIndicator(); } catch (_) {}
        if (!chatMessages) return;
        if (chatMessages.querySelector(`[data-stream-id="${messageId}"]`)) {
          return;
        }
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message assistant streaming';
        messageDiv.setAttribute('data-stream-id', messageId);

        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();

        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';
        textDiv.textContent = '';

        messageDiv.appendChild(timeDiv);
        messageDiv.appendChild(textDiv);
        chatMessages.appendChild(messageDiv);
        streamBuffers[messageId] = '';
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function appendStreamingChunk(messageId, delta) {
        if (!delta) return;
        let messageDiv = chatMessages && chatMessages.querySelector(`[data-stream-id="${messageId}"]`);
        if (!messageDiv) {
          beginStreamingResponse(messageId);
          messageDiv = chatMessages && chatMessages.querySelector(`[data-stream-id="${messageId}"]`);
        }
        streamBuffers[messageId] = (streamBuffers[messageId] || '') + delta;
        if (messageDiv) {
          const textDiv = messageDiv.querySelector('.message-text');
          if (textDiv) {
            textDiv.textContent = streamBuffers[messageId];
          }
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }
      }

      function finalizeStreamingResponse(messageId, response) {
        if (messageId && chatMessages) {
          const messageDiv = chatMessages.querySelector(`[data-stream-id="${messageId}"]`);
          if (messageDiv) {
            messageDiv.remove();
          }
        }
        if (messageId && streamBuffers[messageId] !== undefined) {
          delete streamBuffers[messageId];
        }
        try { hideThinkingIndicator(); } catch (_) {}
        renderAssistantResponse(response);
      }

      // Basic IPC Event Listeners - simplified
      
      // Listen for transcription events
      if (whysperAPI) {
        whysperAPI.onTranscriptionReceived((event, data) => {
          if (data && data.text) {
            handleTranscription(data.text, data.transcriptionOnly, data.translationPT, data.speaker);
          } else {
            console.warn('Invalid transcription data received:', data);
          }
        });

        whysperAPI.onInterimTranscription((event, data) => {
          if (data && data.text) {
            showInterimText(data.text);
          }
        });

        // Listen for speech status
        whysperAPI.onSpeechStatus((event, data) => {
          if (data && data.status) {
            addMessage(data.status, 'system');

            if (data.status.includes('started') || data.status.includes('Recording')) {
              handleRecordingStarted();
            } else if (data.status.includes('stopped') || data.status.includes('ended')) {
              handleRecordingStopped();
            }
          }
        });

        // Listen for speech errors
        whysperAPI.onSpeechError((event, data) => {
          if (data && data.error) {
            addMessage(`Error in recognizing speech`, 'error');
            handleRecordingStopped();
          }
        });

        // Listen for other events
        whysperAPI.onRecordingStarted(() => {
          handleRecordingStarted();
        });

        whysperAPI.onRecordingStopped(() => {
          handleRecordingStopped();
        });

        if (whysperAPI.onMeetingEnded) {
          whysperAPI.onMeetingEnded((event, data) => {
            showMeetingEndedBanner(data);
          });
        }

        if (whysperAPI.onTranscriptSummaryReady) {
          whysperAPI.onTranscriptSummaryReady((event, data) => {
            if (data && data.summary) {
              addMeetingSummaryMessage(data.summary, {
                fileName: data.fileName,
                filePath: data.filePath,
                time: new Date().toLocaleTimeString()
              });
            }
          });
        }

        whysperAPI.onSessionCleared(() => {
          addMessage('Session memory has been cleared', 'system');
        });

        if (whysperAPI.onSkillChanged) {
          whysperAPI.onSkillChanged((event, data) => {
            if (data && data.skill) {
              currentSkill = data.skill;
              if (currentSkill === 'transcript') {
                try { hideThinkingIndicator(); } catch (_) {}
              }
            }
          });
        }

        // Live streaming handlers for transcription LLM responses
        if (whysperAPI.onTranscriptionLlmResponseStart) {
          whysperAPI.onTranscriptionLlmResponseStart((event, data) => {
            if (data && data.messageId) {
              beginStreamingResponse(data.messageId);
            }
          });
        }

        if (whysperAPI.onTranscriptionLlmResponseChunk) {
          whysperAPI.onTranscriptionLlmResponseChunk((event, data) => {
            if (data && data.messageId) {
              appendStreamingChunk(data.messageId, data.delta || '');
            }
          });
        }

        // Replace transcription LLM handler to store text + snippets
        whysperAPI.onTranscriptionLlmResponse((event, data) => {
          if (data && data.response) {
            finalizeStreamingResponse(data.messageId, data.response);
          }
        });
      }

      async function handleUserChatMessage(rawText) {
        const text = (rawText || '').trim();
        if (!text) return;

        // Check for meeting summary commands
        const lower = text.toLowerCase();
        if (
          lower === '/resumo' ||
          lower === '/summary' ||
          lower === 'resumir reuniao' ||
          lower === 'resumir reunião' ||
          lower === 'resumo da reuniao' ||
          lower === 'resumo da reunião'
        ) {
          addMessage(text, 'user');
          messageInput.value = '';
          autoGrow(messageInput);
          triggerMeetingSummarization();
          return;
        }

        addMessage(text, 'user');
        messageInput.value = '';
        autoGrow(messageInput);
        
        setTimeout(() => {
          showThinkingIndicator();
        }, 300);
        
        try {
          if (whysperAPI && whysperAPI.sendChatMessage) {
            await whysperAPI.sendChatMessage(text);
          }
        } catch (error) {
          console.error('Failed to send chat message to main process:', error);
        }
      }

      if (sendButton) {
        sendButton.addEventListener('click', () => {
          handleUserChatMessage(messageInput.value);
        });

      // Auto-resize for multiline textarea
      function autoGrow(el) {

        el.style.height = 'auto';

      if (messageInput) {

        messageInput.addEventListener('input', () => autoGrow(messageInput));

      // Replace keypress with keydown to support Shift+Enter for newline and Enter to send
      if (messageInput) {
        messageInput.addEventListener('keydown', async (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {

      async function loadMeetingsHistory() {
        if (!historyCardsContainer) return;
        historyCardsContainer.innerHTML = '<div class="history-loading-indicator" style="text-align: center; padding: 30px; color: rgba(255,255,255,0.5); font-size: 12px;"><i class="fas fa-spinner fa-spin"></i> Carregando reuniões...</div>';

        try {
          if (!whysperAPI || !whysperAPI.getCallTranscripts) {
            historyCardsContainer.innerHTML = '<div style="padding: 20px; color: #ff5252; font-size: 12px;">Histórico não suportado nesta versão.</div>';
            return;
          }

          const res = await whysperAPI.getCallTranscripts();
          if (res && res.success && Array.isArray(res.transcripts)) {
            historyMeetings = res.transcripts;
          } else {
            historyMeetings = [];
          }

          updateHistoryStats();
          renderMeetingCards();

          // If currentSelectedMeeting is still in list, keep it, else select first if available
          if (currentSelectedMeeting) {
            const found = historyMeetings.find(m => m.name === currentSelectedMeeting.name);
            if (found) {
              selectMeeting(found);
            } else if (historyMeetings.length > 0) {
              selectMeeting(historyMeetings[0]);
            } else {
              resetPreviewPane();
            }
          } else if (historyMeetings.length > 0) {
            selectMeeting(historyMeetings[0]);
          } else {
            resetPreviewPane();
          }
        } catch (err) {
          console.error('Falha ao carregar reuniões:', err);
          historyCardsContainer.innerHTML = `<div style="padding: 20px; color: #ff5252; font-size: 12px;">Erro ao carregar: ${escapeHtml(err.message)}</div>`;
        }
      }

      function updateHistoryStats() {
        if (!historyStatsPill) return;
        const total = historyMeetings.length;
        const summarized = historyMeetings.filter(m => m.hasSummary).length;
        historyStatsPill.textContent = `${total} ${total === 1 ? 'reunião' : 'reuniões'} • ${summarized} ${summarized === 1 ? 'resumo' : 'resumos'}`;
      }

      function renderMeetingCards() {
        if (!historyCardsContainer) return;
        const query = (historySearchInput ? historySearchInput.value : '').trim().toLowerCase();

        const filtered = historyMeetings.filter(m => {
          if (!query) return true;
          const searchHaystack = [
            m.name || '',
            m.skill || '',
            m.sessionDate || '',
            m.preview || '',
            m.summaryPreview || '',
            (m.speakers || []).join(' ')
          ].join(' ').toLowerCase();
          return searchHaystack.includes(query);
        });

        if (filtered.length === 0) {
          historyCardsContainer.innerHTML = `
            <div style="text-align: center; padding: 40px 15px; color: rgba(255,255,255,0.4); font-size: 12px;">
              <i class="fas fa-search" style="font-size: 24px; margin-bottom: 8px; opacity: 0.5;"></i>
              <div>${query ? 'Nenhuma reunião encontrada para a busca.' : 'Nenhuma reunião gravada ainda.'}</div>
            </div>
          `;
          return;
        }

        historyCardsContainer.innerHTML = '';
        filtered.forEach(meeting => {
          const card = document.createElement('div');
          const isSelected = currentSelectedMeeting && currentSelectedMeeting.name === meeting.name;
          card.className = `history-meeting-card ${isSelected ? 'selected' : ''}`;
          card.dataset.name = meeting.name;

          // Format date or display name
          const dateStr = meeting.sessionDate || meeting.name.replace(/transcript_|call_/i, '').replace(/\.txt$/i, '');
          const durationStr = meeting.duration ? `⏱️ ${escapeHtml(meeting.duration)}` : '';
          const wordCountStr = meeting.wordCount ? `📝 ${meeting.wordCount} palavras` : (meeting.utteranceCount ? `💬 ${meeting.utteranceCount} falas` : '');
          
          // Speaker tags
          const speakersHtml = (meeting.speakers || []).map(sp => {
            const isInterviewer = sp.includes('ENTREVISTADOR') || sp.includes('OUTROS');
            const isUser = sp.includes('VOCÊ') || sp.includes('VOCE') || sp.includes('CANDIDATO');
            const cls = isInterviewer ? 'interviewer' : (isUser ? 'user' : 'speaker');
            return `<span class="speaker-badge ${cls}" style="font-size: 8px; padding: 1px 4px; margin: 0;">${escapeHtml(sp)}</span>`;
          }).join(' ');

          const summaryBadgeHtml = meeting.hasSummary
            ? '<span class="card-summary-badge has-summary"><i class="fas fa-file-invoice"></i> Resumo</span>'
            : '<span class="card-summary-badge no-summary">Sem resumo</span>';

          const previewSnippet = meeting.summaryPreview || meeting.preview || 'Sem pré-visualização de texto';

          card.innerHTML = `
            <div class="card-top-row">
              <span class="card-date">${escapeHtml(dateStr)}</span>
              ${summaryBadgeHtml}
            </div>
            <div class="card-meta-row">
              ${meeting.skill ? `<span style="text-transform: uppercase; font-weight: 700; color: #b388ff;">[${escapeHtml(meeting.skill)}]</span>` : ''}
              ${durationStr ? `<span>${durationStr}</span>` : ''}
              ${wordCountStr ? `<span>${wordCountStr}</span>` : ''}
            </div>
            ${speakersHtml ? `<div style="display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap;">${speakersHtml}</div>` : ''}
            <div class="card-preview-text">${escapeHtml(previewSnippet)}</div>
          `;

          card.addEventListener('click', () => {
            selectMeeting(meeting);
          });

          historyCardsContainer.appendChild(card);
        });
      }

      function resetPreviewPane() {
        currentSelectedMeeting = null;
        currentMeetingTranscriptText = '';
        currentMeetingSummaryText = '';
        if (previewEmptyState) previewEmptyState.style.display = 'flex';
        if (previewActiveContent) previewActiveContent.style.display = 'none';
      }

      async function selectMeeting(meeting) {
        currentSelectedMeeting = meeting;

        // Highlight selected card
        if (historyCardsContainer) {
          const cards = historyCardsContainer.querySelectorAll('.history-meeting-card');
          cards.forEach(c => {
            c.classList.toggle('selected', c.dataset.name === meeting.name);
          });
        }

        if (previewEmptyState) previewEmptyState.style.display = 'none';
        if (previewActiveContent) previewActiveContent.style.display = 'flex';

        // Title & metadata
        if (previewMeetingTitle) {
          previewMeetingTitle.textContent = meeting.sessionDate || meeting.name;
        }

        if (previewMetaRow) {
          const parts = [];
          if (meeting.skill) parts.push(`<strong>Skill:</strong> ${escapeHtml(meeting.skill)}`);
          if (meeting.duration) parts.push(`<strong>Duração:</strong> ${escapeHtml(meeting.duration)}`);
          if (meeting.utteranceCount) parts.push(`<strong>Falas:</strong> ${meeting.utteranceCount}`);
          if (meeting.wordCount) parts.push(`<strong>Palavras:</strong> ${meeting.wordCount}`);
          if (meeting.speakers && meeting.speakers.length > 0) parts.push(`<strong>Locutores:</strong> ${meeting.speakers.join(', ')}`);
          previewMetaRow.innerHTML = parts.join(' &nbsp;•&nbsp; ');
        }

        // Update button state for summary
        updateSummaryBtnState(meeting.hasSummary);

        // Fetch contents
        if (previewBody) {
          previewBody.innerHTML = '<div style="text-align: center; padding: 40px; color: rgba(255,255,255,0.4);"><i class="fas fa-spinner fa-spin"></i> Carregando conteúdo...</div>';
        }

        try {
          const [transcriptRes, summaryRes] = await Promise.all([
            whysperAPI.getCallTranscriptContent(meeting.name),
            whysperAPI.getCallTranscriptSummary(meeting.name)
          ]);

          currentMeetingTranscriptText = (transcriptRes && transcriptRes.success) ? transcriptRes.content : '';
          currentMeetingSummaryText = (summaryRes && summaryRes.success) ? summaryRes.summary : '';

          // If summary exists, show summary tab by default, otherwise show transcript tab
          if (currentMeetingSummaryText && currentMeetingSummaryText.trim()) {
            meeting.hasSummary = true;
            setActivePreviewTab('summary');
          } else {
            meeting.hasSummary = false;
            setActivePreviewTab('transcript');
          }
          updateSummaryBtnState(meeting.hasSummary);
        } catch (err) {
          if (previewBody) {
            previewBody.innerHTML = `<div style="color: #ff5252; padding: 20px;">Erro ao carregar conteúdo: ${escapeHtml(err.message)}</div>`;
          }
        }
      }

      function updateSummaryBtnState(hasSummary) {
        if (!previewGenerateSummaryBtn) return;
        if (isSummarizingInModal) {
          previewGenerateSummaryBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resumindo...';
          previewGenerateSummaryBtn.disabled = true;
        } else {
          previewGenerateSummaryBtn.disabled = false;
          previewGenerateSummaryBtn.innerHTML = hasSummary
            ? '<i class="fas fa-sync-alt"></i> Re-resumir com IA'
            : '<i class="fas fa-magic"></i> Resumir com IA';
        }
      }

      function setActivePreviewTab(tab) {
        activePreviewTab = tab;
        if (tabSummaryBtn) tabSummaryBtn.classList.toggle('active', tab === 'summary');
        if (tabTranscriptBtn) tabTranscriptBtn.classList.toggle('active', tab === 'transcript');
        renderActivePreviewBody();
      }

      function renderActivePreviewBody() {
        if (!previewBody) return;

        if (activePreviewTab === 'summary') {
          if (currentMeetingSummaryText && currentMeetingSummaryText.trim()) {
            previewBody.innerHTML = formatMarkdown(currentMeetingSummaryText);
            if (window.renderMathInElement) window.renderMathInElement(previewBody);
          } else {
            previewBody.innerHTML = `
              <div style="text-align: center; padding: 50px 20px; color: rgba(255, 255, 255, 0.5);">
                <i class="fas fa-file-invoice" style="font-size: 36px; color: #7c4dff; opacity: 0.8; margin-bottom: 14px; display: block;"></i>
                <div style="font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 6px;">Nenhum resumo gerado ainda</div>
                <div style="font-size: 12px; margin-bottom: 18px; max-width: 400px; margin-left: auto; margin-right: auto;">
                  Esta reunião possui a transcrição salva. Clique no botão abaixo para gerar uma ata executiva detalhada com perguntas, respostas e itens de ação.
                </div>
                <button class="preview-action-btn primary" id="emptyGenerateSummaryBtn" style="font-size: 12px; padding: 8px 16px;">
                  <i class="fas fa-magic"></i> Gerar Resumo Agora com IA
                </button>
              </div>
            `;
            const emptyBtn = document.getElementById('emptyGenerateSummaryBtn');
            if (emptyBtn) {
              emptyBtn.addEventListener('click', () => {
                triggerModalMeetingSummarization();
              });
            }
          }
        } else {
          // Render transcript with dialog speaker tags
          if (!currentMeetingTranscriptText || !currentMeetingTranscriptText.trim()) {
            previewBody.innerHTML = '<div style="color: rgba(255,255,255,0.4); text-align: center; padding: 40px;">Transcrição vazia.</div>';
            return;
          }

          const lines = currentMeetingTranscriptText.split('\n');
          const renderedLines = [];
          let isHeaderSection = true;
          const headerLines = [];

          for (const rawLine of lines) {
            const line = rawLine.trim();
            if (!line) continue;

            if (line.startsWith('===') || line.startsWith('OPENCLUELY') || line.startsWith('Session Date:') || line.startsWith('Mode / Skill:') || line.startsWith('Total Utterances') || line.startsWith('Duration:') || line.startsWith('Total Words')) {
              headerLines.push(line);
              continue;
            }

            // Spoken utterance turn: [HH:MM:SS] [SPEAKER] Text
            const turnMatch = line.match(/^\[(\d{2}:\d{2}:\d{2})\]\s*\[(.*?)\]\s*(.*)$/);
            if (turnMatch) {
              const [, time, speaker, spokenText] = turnMatch;
              const upperSp = speaker.toUpperCase();
              const isInterviewer = upperSp.includes('ENTREVISTADOR') || upperSp.includes('OUTROS');
              const isUser = upperSp.includes('VOCÊ') || upperSp.includes('VOCE') || upperSp.includes('CANDIDATO');
              const badgeClass = isInterviewer ? 'interviewer' : (isUser ? 'user' : 'speaker');
              const badgeIcon = isInterviewer ? 'fa-user-tie' : (isUser ? 'fa-microphone' : 'fa-user');

              renderedLines.push(`
                <div style="margin-bottom: 12px; background: rgba(255,255,255,0.02); border-left: 3px solid ${isInterviewer ? '#00e5ff' : (isUser ? '#00e676' : 'rgba(255,255,255,0.2)')}; padding: 8px 12px; border-radius: 4px;">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                    <span class="speaker-badge ${badgeClass}"><i class="fas ${badgeIcon}"></i> ${escapeHtml(speaker)}</span>
                    <span style="font-size: 10px; color: rgba(255,255,255,0.4);">${escapeHtml(time)}</span>
                  </div>
                  <div style="font-size: 13px; color: rgba(255,255,255,0.9); line-height: 1.45; white-space: pre-wrap;">${escapeHtml(spokenText)}</div>
                </div>
              `);
            } else {
              renderedLines.push(`<div style="font-size: 12px; color: rgba(255,255,255,0.7); margin-bottom: 6px;">${escapeHtml(line)}</div>`);
            }
          }

          const headerHtml = headerLines.length > 0
            ? `<div style="background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 10px 14px; font-family: monospace; font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 16px; white-space: pre-wrap;">${escapeHtml(headerLines.join('\n'))}</div>`
            : '';

          previewBody.innerHTML = headerHtml + renderedLines.join('');
        }
      }

      async function triggerModalMeetingSummarization() {
        if (!currentSelectedMeeting || isSummarizingInModal) return;
        isSummarizingInModal = true;
        updateSummaryBtnState(currentSelectedMeeting.hasSummary);

        if (previewBody) {
          previewBody.innerHTML = `
            <div style="text-align: center; padding: 60px 20px; color: rgba(255, 255, 255, 0.7);">
              <i class="fas fa-spinner fa-spin" style="font-size: 36px; color: #7c4dff; margin-bottom: 14px; display: block;"></i>
              <div style="font-size: 14px; font-weight: 600; color: #fff;">Resumindo reunião com IA (Gemini)...</div>
              <div style="font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 6px;">Isso pode levar alguns segundos dependendo da duração da conversa.</div>
            </div>
          `;
        }

        try {
          const res = await whysperAPI.summarizeCallTranscript(currentSelectedMeeting.name);
          if (res && res.success && res.summary) {
            currentMeetingSummaryText = res.summary;
            currentSelectedMeeting.hasSummary = true;
            currentSelectedMeeting.summaryPreview = res.summary.substring(0, 180);
            updateHistoryStats();
            renderMeetingCards();
            setActivePreviewTab('summary');
          } else {
            alert('Falha ao gerar resumo: ' + (res?.error || 'Erro desconhecido'));
            renderActivePreviewBody();
          }
        } catch (err) {
          alert('Erro ao resumir reunião: ' + err.message);
          renderActivePreviewBody();
        } finally {
          isSummarizingInModal = false;
          if (currentSelectedMeeting) {
            updateSummaryBtnState(currentSelectedMeeting.hasSummary);
          }
        }
      }

      // History Modal Event Listeners
      if (transcriptsHistoryBtn) {
        transcriptsHistoryBtn.addEventListener('click', openHistoryModal);
      }
      if (closeHistoryModalBtn) {
        closeHistoryModalBtn.addEventListener('click', closeHistoryModal);
      }
      if (historyModal) {
        historyModal.addEventListener('click', (e) => {
          if (e.target === historyModal) closeHistoryModal();
        });
      }
      if (historyOpenFolderBtn) {
        historyOpenFolderBtn.addEventListener('click', () => {
          if (whysperAPI && whysperAPI.openTranscriptsFolder) whysperAPI.openTranscriptsFolder();
        });
      }
      if (historySearchInput) {
        historySearchInput.addEventListener('input', () => {
          renderMeetingCards();
        });
      }
      if (tabSummaryBtn) {
        tabSummaryBtn.addEventListener('click', () => setActivePreviewTab('summary'));
      }
      if (tabTranscriptBtn) {
        tabTranscriptBtn.addEventListener('click', () => setActivePreviewTab('transcript'));
      }
      if (previewCopyBtn) {
        previewCopyBtn.addEventListener('click', () => {
          const textToCopy = activePreviewTab === 'summary' ? currentMeetingSummaryText : currentMeetingTranscriptText;
          if (!textToCopy) return;

          if (whysperAPI && whysperAPI.copyToClipboard) {
            whysperAPI.copyToClipboard(textToCopy);
          } else if (navigator.clipboard) {
            navigator.clipboard.writeText(textToCopy);
          }

          const originalHtml = previewCopyBtn.innerHTML;
          previewCopyBtn.innerHTML = '<i class="fas fa-check"></i> Copiado!';
          previewCopyBtn.style.background = '#00e676';
          setTimeout(() => {
            previewCopyBtn.innerHTML = originalHtml;
            previewCopyBtn.style.background = '';
          }, 2000);
        });
      }
      if (previewGenerateSummaryBtn) {
        previewGenerateSummaryBtn.addEventListener('click', triggerModalMeetingSummarization);
      }
      if (previewOpenFileBtn) {
        previewOpenFileBtn.addEventListener('click', () => {
          if (currentSelectedMeeting && whysperAPI && whysperAPI.openTranscriptFile) {
            whysperAPI.openTranscriptFile(currentSelectedMeeting.name);
          }
        });
      }
      if (previewDeleteBtn) {
        previewDeleteBtn.addEventListener('click', async () => {
          if (!currentSelectedMeeting) return;
          const ok = confirm(`Deseja realmente excluir a gravação "${currentSelectedMeeting.name}" e seus resumos salvos?\nEsta ação não poderá ser desfeita.`);
          if (!ok) return;

          try {
            const res = await whysperAPI.deleteCallTranscript(currentSelectedMeeting.name);
            if (res && res.success) {
              const deletedName = currentSelectedMeeting.name;
              historyMeetings = historyMeetings.filter(m => m.name !== deletedName);
              currentSelectedMeeting = null;
              updateHistoryStats();
              renderMeetingCards();
              if (historyMeetings.length > 0) {
                selectMeeting(historyMeetings[0]);
              } else {
                resetPreviewPane();
              }
            } else {
              alert('Erro ao excluir: ' + (res?.error || 'Erro desconhecido'));
            }
          } catch (err) {
            alert('Falha ao excluir arquivo: ' + err.message);
          }
        });
      }

      // Global keyboard shortcut to close modal on Escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && historyModal && historyModal.classList.contains('active')) {
          closeHistoryModal();
        }
      });

      // Global keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        if (e.altKey && e.key === 'r') {
          e.preventDefault();
          if (!isInteractive || !speechAvailable) return;
          micButton && micButton.click();
        }
      });

      // Initialize
      if (!chatHistory || chatHistory.length === 0) {
        addMessage('Recording in Progress. press Alt+R to stop recording.', 'system');
      }
    </script>
  </body>
</html>
